name: Sync Profile to Website

on:
  push:
    branches:
      - main
    paths:
      - README.md

jobs:
  notify-website:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger website sync
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/plna/plna.github.io/dispatches \
            -f event_type=sync-profile
